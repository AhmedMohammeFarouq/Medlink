<div class="notifications-page">

    <div class="page-header mb-6">
    <div>
        <h2 class="text-2xl font-bold">Doctor Notifications</h2>

        <p class="text-muted text-sm">
        Stay updated with your appointments, patients, prescriptions, and messages
        </p>
    </div>

    @if (notifications.length > 0) {
        <button class="btn btn-outline btn-sm" (click)="markAllAsRead()">
        <span class="material-symbols-outlined">done_all</span>
        <span>Mark All Read</span>
        </button>
    }
    </div>


    @if (isLoading) {

    <div class="card text-center py-12">
        <p class="text-muted">Loading notifications...</p>
    </div>

    }

    @else if (notifications.length === 0) {

    <app-empty-state
        icon="notifications"
        title="No New Notifications"
        description="You have no unread notifications at the moment.">
    </app-empty-state>

    }

    @else {

    <div class="flex flex-col gap-3">

        @for (n of notifications; track n._id) {

        <app-notification-card
            [notification]="n"
            (markRead)="onMarkRead($event)">
        </app-notification-card>

        }

    </div>

    }

</div>
