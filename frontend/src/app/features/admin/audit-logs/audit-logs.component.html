<div class="audit-logs-page">
  <div class="page-header mb-6">
    <div>
      <h2 class="text-2xl font-bold">Security & System Audit Logs</h2>
      <p class="text-muted text-sm">Immutable trail of authentication events, user role alterations, and data transactions</p>
    </div>
  </div>

  <div class="card">
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Event Action</th>
            <th>Principal / User</th>
            <th>IP Address</th>
            <th>Status</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>
          @for (log of logs; track log.time) {
            <tr>
              <td><span class="badge badge-primary font-mono">{{ log.event }}</span></td>
              <td>{{ log.user }}</td>
              <td class="font-mono text-xs">{{ log.ip }}</td>
              <td><span class="badge badge-success">{{ log.status }}</span></td>
              <td class="text-xs text-muted">{{ log.time }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
