<div class="statistics-page">
  <div class="page-header mb-6">
    <div>
      <h2 class="text-2xl font-bold">System Health & Metrics</h2>
      <p class="text-muted text-sm">Real-time technical metrics, database connection latency, and storage status</p>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
    @for (m of systemMetrics; track m.label) {
      <div class="card stat-card">
        <div class="stat-icon-wrap primary">
          <span class="material-symbols-outlined">{{ m.icon }}</span>
        </div>
        <div>
          <span class="stat-val">{{ m.val }}</span>
          <span class="stat-label">{{ m.label }}</span>
        </div>
      </div>
    }
  </div>
</div>
